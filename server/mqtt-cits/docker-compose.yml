# CITS-to-go MQTT broker on mqtt.dirksreich.de
#   8883/tcp  MQTT over TLS for the apps (public)
#   9002/tcp  MQTT over WebSocket, localhost only; nginx serves it as wss://mqtt.dirksreich.de/mqtt
#   1883/tcp  plain MQTT on the internal compose network only (archiver, ingest)
#   5434/tcp  TimescaleDB (packets), localhost only
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-cits
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "127.0.0.1:9002:9001"
    volumes:
      - ./config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log

  archiver:
    build: ./archiver
    container_name: mqtt-cits-archiver
    restart: unless-stopped
    depends_on: [mosquitto]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - ./archive:/archive

  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: mqtt-cits-db
    restart: unless-stopped
    env_file: .env.db
    ports:
      - "127.0.0.1:5434:5432"     # nur lokal / per SSH-Tunnel
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=30"]
    volumes:
      - ./db:/var/lib/postgresql/data

  ingest:
    build: ./ingest
    container_name: mqtt-cits-ingest
    restart: unless-stopped
    depends_on: [mosquitto, db]
    env_file: [.env, .env.db]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - ./archive:/archive:ro      # für --backfill

  api:
    build: ./ingest
    container_name: mqtt-cits-api
    restart: unless-stopped
    depends_on: [db]
    env_file: .env.db
    command: ["python", "-u", "api.py"]
    ports:
      - "127.0.0.1:8095:8095"     # nginx: https://cits.dirksreich.de/api/
