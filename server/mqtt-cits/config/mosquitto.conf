# Senden ohne Zugangsdaten erlaubt (wie OpenTrafficMap); was Anonyme dürfen, regelt die ACL
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
max_packet_size 65536

# Apps (TLS)
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

# Browser live view, TLS terminated by nginx
listener 9001
protocol websockets

# Internal compose network only (not published)
listener 1883

# Weiterleitung einzelner Empfänger an OpenTrafficMap (Relay).
# Für Empfänger, deren App nur einen Server kennt (z. B. Android): alles, was sie hier
# unter ihrer Node-ID hochladen, geht unverändert auch an OpenTrafficMap.
# Weitere Empfänger: eine Zeile "topic its/<node>/# out 0" ergänzen.
connection otm-relay
address cits1.opentrafficmap.org:8883
bridge_cafile /etc/ssl/certs/ca-certificates.crt
remote_clientid cits-relay-dirksreich
local_username cits-read
bridge_protocol_version mqttv311
cleansession true
try_private false
notifications false
topic its/SmarduPilot/# out 0
